<!-- ЦЕНА -->

<details class="filter-group" open>
  <summary>Цена</summary>
  <div class="price-range">
    <input type="number" name="price_min" placeholder="от" min="0">
    <span class="dash">—</span>
    <input type="number" name="price_max" placeholder="до" min="0">
  </div>
</details>

<!-- ПРОИЗВОДИТЕЛЬ -->

<details class="filter-group">
  <summary>Производитель</summary>
  <div class="filter-options">
    <label class="checkbox-row"><input type="checkbox" name="brand" value="asus"><span>ASUS</span></label>
    <label class="checkbox-row"><input type="checkbox" name="brand" value="msi"><span>MSI</span></label>
    <label class="checkbox-row"><input type="checkbox" name="brand" value="gigabyte"><span>GIGABYTE</span></label>
    <label class="checkbox-row"><input type="checkbox" name="brand" value="palit"><span>Palit</span></label>
    <label class="checkbox-row"><input type="checkbox" name="brand" value="sapphire"><span>Sapphire</span></label>
    <label class="checkbox-row"><input type="checkbox" name="brand" value="asrock"><span>ASRock</span></label>
  </div>
</details>

<!-- ПРОИЗВОДИТЕЛЬ ЧИПА -->

<details class="filter-group">
  <summary>Производитель чипа</summary>
  <div class="filter-options">
    <label class="checkbox-row"><input type="checkbox" name="chip" value="nvidia"><span>NVIDIA</span></label>
    <label class="checkbox-row"><input type="checkbox" name="chip" value="amd"><span>AMD</span></label>
    <label class="checkbox-row"><input type="checkbox" name="chip" value="intel"><span>Intel</span></label>
  </div>
</details>

<!-- СЕРИЯ ВИДЕОКАРТЫ -->

<details class="filter-group">
  <summary>Серия видеокарты</summary>
  <div class="filter-options">
    <label class="checkbox-row"><input type="checkbox" name="series" value="rtx50"><span>GeForce RTX 50</span></label>
    <label class="checkbox-row"><input type="checkbox" name="series" value="rtx40"><span>GeForce RTX 40</span></label>
    <label class="checkbox-row"><input type="checkbox" name="series" value="rtx30"><span>GeForce RTX 30</span></label>
    <label class="checkbox-row"><input type="checkbox" name="series" value="rx9000"><span>Radeon RX 9000</span></label>
    <label class="checkbox-row"><input type="checkbox" name="series" value="rx7000"><span>Radeon RX 7000</span></label>
    <label class="checkbox-row"><input type="checkbox" name="series" value="arc"><span>Intel Arc</span></label>
  </div>
</details>

<!-- ОБЪЁМ ВИДЕОПАМЯТИ -->

<details class="filter-group">
  <summary>Объём видеопамяти</summary>
  <div class="filter-options">
    <label class="checkbox-row"><input type="checkbox" name="memory" value="4"><span>4 ГБ</span></label>
    <label class="checkbox-row"><input type="checkbox" name="memory" value="6"><span>6 ГБ</span></label>
    <label class="checkbox-row"><input type="checkbox" name="memory" value="8"><span>8 ГБ</span></label>
    <label class="checkbox-row"><input type="checkbox" name="memory" value="12"><span>12 ГБ</span></label>
    <label class="checkbox-row"><input type="checkbox" name="memory" value="16"><span>16 ГБ</span></label>
    <label class="checkbox-row"><input type="checkbox" name="memory" value="24"><span>24 ГБ и более</span></label>
  </div>
</details>

<!-- ТИП ВИДЕОПАМЯТИ -->

<details class="filter-group">
  <summary>Тип видеопамяти</summary>
  <div class="filter-options">
    <label class="checkbox-row"><input type="checkbox" name="memory_type" value="gddr6"><span>GDDR6</span></label>
    <label class="checkbox-row"><input type="checkbox" name="memory_type" value="gddr6x"><span>GDDR6X</span></label>
    <label class="checkbox-row"><input type="checkbox" name="memory_type" value="gddr7"><span>GDDR7</span></label>
  </div>
</details>

<!-- РАЗРЯДНОСТЬ ШИНЫ -->

<details class="filter-group">
  <summary>Разрядность шины памяти</summary>
  <div class="filter-options">
    <label class="checkbox-row"><input type="checkbox" name="bus" value="128"><span>128 бит</span></label>
    <label class="checkbox-row"><input type="checkbox" name="bus" value="192"><span>192 бит</span></label>
    <label class="checkbox-row"><input type="checkbox" name="bus" value="256"><span>256 бит</span></label>
    <label class="checkbox-row"><input type="checkbox" name="bus" value="320"><span>320 бит</span></label>
    <label class="checkbox-row"><input type="checkbox" name="bus" value="384"><span>384 бит</span></label>
  </div>
</details>

<!-- PCI EXPRESS -->

<details class="filter-group">
  <summary>Интерфейс PCI Express</summary>
  <div class="filter-options">
    <label class="checkbox-row"><input type="checkbox" name="pcie" value="5"><span>PCIe 5.0</span></label>
    <label class="checkbox-row"><input type="checkbox" name="pcie" value="4"><span>PCIe 4.0</span></label>
    <label class="checkbox-row"><input type="checkbox" name="pcie" value="3"><span>PCIe 3.0</span></label>
  </div>
</details>

<!-- ДЛИНА ВИДЕОКАРТЫ -->

<details class="filter-group">
  <summary>Длина видеокарты</summary>
  <div class="filter-options">
    <label class="checkbox-row"><input type="checkbox" name="length" value="250"><span>До 250 мм</span></label>
    <label class="checkbox-row"><input type="checkbox" name="length" value="300"><span>250–300 мм</span></label>
    <label class="checkbox-row"><input type="checkbox" name="length" value="350"><span>300–350 мм</span></label>
    <label class="checkbox-row"><input type="checkbox" name="length" value="351"><span>Более 350 мм</span></label>
  </div>
</details>

<!-- ТРАССИРОВКА ЛУЧЕЙ -->

<details class="filter-group">
  <summary>Трассировка лучей</summary>
  <div class="filter-options">
    <label class="checkbox-row"><input type="checkbox" name="ray_tracing" value="1"><span>Поддерживается</span></label>
  </div>
</details>

<!-- RGB-ПОДСВЕТКА -->

<details class="filter-group">
  <summary>RGB-подсветка</summary>
  <div class="filter-options">
    <label class="checkbox-row"><input type="checkbox" name="rgb" value="1"><span>Есть</span></label>
  </div>
</details>

<!-- ЦВЕТ -->

<details class="filter-group">
  <summary>Цвет</summary>
  <div class="filter-options">
    <label class="checkbox-row"><input type="checkbox" name="color" value="black"><span>Чёрный</span></label>
    <label class="checkbox-row"><input type="checkbox" name="color" value="white"><span>Белый</span></label>
    <label class="checkbox-row"><input type="checkbox" name="color" value="silver"><span>Серебристый</span></label>
    <label class="checkbox-row"><input type="checkbox" name="color" value="gray"><span>Серый</span></label>
  </div>
</details>
