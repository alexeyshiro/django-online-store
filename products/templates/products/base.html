{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{{ title }}</title>

    <link href="{% static 'online_store/css/base.css' %}" rel="stylesheet">

    {% block css %} {% endblock %}

</head>
<body>
    <header>
        <a class="logo-btn"  href="{% url 'index' %}">
        <span class="box">OS</span>
        <span class="store-word">ONLINE STORE</span>
        </a>
        <nav class="top-links">
        <a href="{% url 'products:index' %}">Каталог</a>
        <a href="{% url 'config' %}">Конфигуратор ПК</a>
        </nav>
       <div class="header-right">
      <a class="cart-btn" aria-label="Избранное" title="Избранное" href="{% url 'users:favorites' %}">
        <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.2-4.4-9.8-8.7C0.6 8.6 1.9 5 5.4 4.3c2.1-.4 3.9.7 6.6 3.3 2.7-2.6 4.5-3.7 6.6-3.3 3.5.7 4.8 4.3 3.2 7.5-2.6 4.3-9.8 8.7-9.8 8.7z"/></svg>
      </a>
      <a class="cart-btn" aria-label="Корзина" title="Корзина" href="{% url 'users:basket' %}">
        <svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.2a2 2 0 002 1.8h7.6a2 2 0 002-1.7L20 8H6"/><circle cx="9.5" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg>
      </a>
      {% if user.is_authenticated %}
        <a href="{% url 'users:account' %}" class="header-cta">Личный кабинет</a>
      {% else %}
        <a href="{% url 'users:login' %}" class="header-cta">Войти в аккаунт</a>
      {% endif %}
    </div>
    </header>

    {% block content %} {% endblock %}

    <footer>
    <span class="footer-placeholder">Здесь потом будет информация</span>
  </footer>

</body>
</html>
